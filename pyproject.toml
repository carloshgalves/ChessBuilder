[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "chessbuilder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-chess>=1.999,<2", "httpx>=0.27,<1", "pypdf>=5,<8"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
diagrams = ["pypdfium2>=4.30,<6", "Pillow>=10,<13", "numpy>=1.26,<3"]
[tool.setuptools.packages.find]
include = ["chessbuilder*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
